<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Uptime Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Serverless Website Uptime Monitor</h1>
      <p class="subtitle">Monitors predefined websites every 5 minutes using AWS Serverless</p>
      <div class="header-actions">
        <button id="checkNowBtn" class="btn">
          <span class="btn-icon">&#x21bb;</span>
          <span id="btnText">Check Now</span>
        </button>
        <span id="lastUpdated" class="last-updated">Last checked: Loading...</span>
      </div>
    </header>

    <main>
      <div id="statusCards" class="cards-grid">
        <!-- Website status cards will be rendered dynamically -->
        <div class="card loading-card">
          <p>Loading status data...</p>
        </div>
      </div>
    </main>

    <footer>
      <p>Powered by <strong>Amazon S3</strong>, <strong>AWS Lambda</strong>, <strong>Amazon EventBridge</strong>, <strong>Amazon SNS</strong>, and <strong>CloudWatch</strong></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
